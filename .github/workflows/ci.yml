name: CI

# Checks only. Cloudflare Pages deploys the site itself: its GitHub integration builds main and
# publishes blog.jmotools.com. This workflow used to run `wrangler pages deploy` into an older
# Pages project of the same name in a different Cloudflare account, where the custom domain is
# deactivated, so its "successful" deploys never reached the live site (found 2026-11-27).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run astro -- check
      - run: npm run build
